# The iPad app. Generated into SimplMakerPad.xcodeproj by `xcodegen` (run in this folder); the project file is not checked in.
# It shares the engine (CADCore, CADKernel) with the Mac app through the package at the repository root, and takes the
# platform-neutral viewport files straight from Sources/SimplMaker, so a fix there is a fix for both apps.
name: SimplMakerPad
options:
  bundleIdPrefix: com.simplmaker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_CXX_LANGUAGE_STANDARD: c++17
packages:
  SimplMaker:
    path: ..
targets:
  SimplMakerPad:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: ../Packaging/AppIcon.icon
        buildPhase: resources
      # Everything the Mac app is made of, except what only makes sense on a Mac. A file in this list that turns out to be portable
      # moves out of it; a Mac-only part of a shared file is fenced with #if os(macOS) instead.
      - path: ../Sources/SimplMaker
        excludes:
          - SimplMakerApp.swift
          - WindowSizeMemory.swift
          - AboutPanel.swift
          - Updater.swift
          - AI/**
          - Viewport/ViewportView.swift
          - Viewport/ViewCube.swift
          - Viewport/ManipulatorView.swift
          - WelcomeView.swift
          - RenameDocument.swift
          - ExportDialog.swift
          - ExportImageDialog.swift
          - FileDrop.swift
          - LicenseTexts.swift
    dependencies:
      - package: SimplMaker
        product: CADCore
      - package: SimplMaker
        product: CADKernel
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SimplMaker
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: SimplMaker Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.simplmaker.document]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.simplmaker.document
            UTTypeDescription: SimplMaker Document
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [simplmaker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplmaker.SimplMaker.pad
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
