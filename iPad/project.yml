# The iPad app. Generated into SimplMakerPad.xcodeproj by `xcodegen` (run in this folder); the project file is not checked in.
# It shares the engine (CADCore, CADKernel) with the Mac app through the package at the repository root, and takes the
# platform-neutral viewport files straight from Sources/SimplMaker, so a fix there is a fix for both apps.
name: SimplMakerPad
options:
  bundleIdPrefix: com.simplmaker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    DEVELOPMENT_TEAM: J4JCLB8BMS
packages:
  SimplMaker:
    path: ..
targets:
  SimplMakerPad:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: ../Packaging/AppIcon.icon
        buildPhase: resources
      # Everything the Mac app is made of, except what only makes sense on a Mac. A file in this list that turns out to be portable
      # moves out of it; a Mac-only part of a shared file is fenced with #if os(macOS) instead.
      - path: ../Sources/SimplMaker
        excludes:
          - SimplMakerApp.swift
          - WindowSizeMemory.swift
          - AboutPanel.swift
          - Updater.swift
          - AI/**
          - Viewport/ViewportView.swift
          - Viewport/ViewCube.swift
          - Viewport/ManipulatorView.swift
          - WelcomeView.swift
          - RenameDocument.swift
          - ExportDialog.swift
          - ExportImageDialog.swift
          - FileDrop.swift
    dependencies:
      - package: SimplMaker
        product: CADCore
      - package: SimplMaker
        product: CADKernel
      - target: SimplMakerPadThumbnail
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SimplMaker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: SimplMaker Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.simplmaker.document]
            CFBundleTypeIconFiles: [DocIcon.png]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.simplmaker.document
            UTTypeDescription: SimplMaker Document
            UTTypeConformsTo: [public.json]
            UTTypeIconFiles: [DocIcon.png]
            UTTypeTagSpecification:
              public.filename-extension: [simplmaker]
          - UTTypeIdentifier: com.simplmaker.browser-item
            UTTypeDescription: SimplMaker Browser Item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplmaker.SimplMaker.pad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: SimplMaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
  # The file browser's picture of a part: a Quick Look thumbnail extension that reads the PNG stored in the file.
  SimplMakerPadThumbnail:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Thumbnail
    info:
      path: Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: SimplMaker Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.simplmaker.document]
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplmaker.SimplMaker.pad.Thumbnail
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_CFBundleDisplayName: SimplMaker
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
