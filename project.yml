# Xcode project for SimplCAD, generated with XcodeGen:  scripts/make-xcodeproj.sh
# The app target compiles Sources/SimplCAD and links the CADCore/CADKernel libraries from the
# Swift package in this folder, so the package (used by CI and `swift test`) stays the single
# source of truth. The generated SimplCAD.xcodeproj is not committed; regenerate it any time.
name: SimplCAD
options:
  bundleIdPrefix: org.simplcad
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SimplCAD:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  SimplCADApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SimplCAD
      - path: Packaging/AppIcon.icns
        buildPhase: resources
      - path: Packaging/Info.plist
        buildPhase: none
    dependencies:
      - package: SimplCAD
        product: CADCore
      - package: SimplCAD
        product: CADKernel
    settings:
      base:
        PRODUCT_NAME: SimplCAD
        PRODUCT_BUNDLE_IDENTIFIER: org.simplcad.SimplCAD
        INFOPLIST_FILE: Packaging/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Signs to run locally. For distribution pick your team under Signing & Capabilities.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
