name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, now-superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The kernel is plain C++ over OpenCASCADE, so it is also tested on Linux (fast, cheap runners).
  kernel-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenCASCADE
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: ThirdParty/occt
          key: occt-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Build OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          scripts/build-occt.sh
      - name: Save OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ThirdParty/occt
          key: occt-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Kernel tests
        run: scripts/test-kernel.sh

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Restore OpenCASCADE
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: ThirdParty/occt
          key: occt-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Build OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          scripts/build-occt.sh
      - name: Save OpenCASCADE
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ThirdParty/occt
          key: occt-${{ runner.os }}-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Kernel tests (C)
        run: scripts/test-kernel.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Xcode project (XcodeGen + xcodebuild)
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          scripts/make-xcodeproj.sh --no-open
          xcodebuild -project SimplCAD.xcodeproj -scheme SimplCADApp -configuration Debug \
            -destination 'platform=macOS' build | tail -n 30
          test -f "$(xcodebuild -project SimplCAD.xcodeproj -scheme SimplCADApp -showBuildSettings | awk '/ BUILT_PRODUCTS_DIR /{print $3}')/SimplCAD.app/Contents/Resources/AppIcon.icns"
      - name: Bundle app
        run: |
          scripts/bundle-app.sh
          ditto -c -k --keepParent dist/SimplCAD.app dist/SimplCAD.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SimplCAD-macOS
          path: dist/SimplCAD.zip
